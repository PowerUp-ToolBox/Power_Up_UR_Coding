[package]
name = "powerup-core"
version = "0.1.0"
description = "PowerUp's platform-independent logic, shared by every OS app."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

# Config and fixture data are JSON, written byte for byte as the Swift app
# writes it (src/wire.rs). unbounded_depth lets config.json nest as deep as
# Foundation's JSON reader allows, not just serde_json's default 128
# (mapping::load_device_mappings bounds the depth itself).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
# Text is counted and cut in grapheme clusters, as Swift's String does
# (src/text.rs). Pinned so the cluster rules only change on purpose: 1.13
# implements Unicode 17, whose rules include the GB9c conjunct rule that
# Swift applies on current macOS (Tests/Fixtures/harness/claude-stream.json
# "a conjunct is one character at the cut" pins it).
unicode-segmentation = "=1.13.3"
