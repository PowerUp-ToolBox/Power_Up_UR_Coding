[package]
name = "powerup-core"
version = "0.1.0"
description = "PowerUp's platform-independent logic, shared by every OS app."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

# Config and fixture data are JSON, written byte for byte as the Swift app
# writes it (src/wire.rs).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
