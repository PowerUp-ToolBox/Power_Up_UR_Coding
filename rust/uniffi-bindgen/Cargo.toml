[package]
name = "uniffi-bindgen"
version = "0.1.0"
description = "Generates the Swift side of the powerup-core bridge (scripts/build-core.sh)."
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { version = "=0.32.2", features = ["cli"] }
