name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build, test, and bundle
    # Pinned deliberately — never `macos-latest` (it rolled from 15 to 26 in
    # June 2026 and silent toolchain jumps break builds). Bump intentionally.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # Until slice 2.2 makes the Rust core mandatory, the app must still
      # build without it.
      - name: Build (without the Rust core)
        run: swift build

      # rust/rust-toolchain.toml pins the compiler; rustup installs it.
      - name: Build the Rust core bridge
        run: ./scripts/build-core.sh debug

      # The shared fixtures (Swift now, the Rust core later) are discovered
      # at run time, so an empty or missing directory would let the scenario
      # suites pass vacuously. Fail loudly instead.
      - name: Shared fixtures are present
        run: |
          test -d Tests/Fixtures || { echo "::error::Tests/Fixtures is missing"; exit 1; }
          count=$(find Tests/Fixtures -type f -name '*.json' | wc -l | tr -d ' ')
          echo "Tests/Fixtures holds $count JSON fixture(s)"
          test "$count" -gt 0 || { echo "::error::Tests/Fixtures holds no JSON fixtures"; exit 1; }
          sessions=$(find Tests/Fixtures/session -type f -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          test "$sessions" -gt 0 || { echo "::error::Tests/Fixtures/session holds no scenarios"; exit 1; }

      - name: Test (with the Rust core)
        run: POWERUP_CORE=1 swift test

      # Full release pipeline: SPM release build, icon generation, .app
      # assembly, ad-hoc signing. Catches build.sh regressions and release-only
      # compile errors.
      - name: Bundle app
        run: ./scripts/build.sh

      - name: Verify bundle
        run: |
          test -x build/PowerUp.app/Contents/MacOS/PowerUp
          test -f build/PowerUp.app/Contents/Resources/AppIcon.icns
          plutil -lint build/PowerUp.app/Contents/Info.plist
          codesign --verify build/PowerUp.app
          nm build/PowerUp.app/Contents/MacOS/PowerUp | grep -q uniffi_powerup_core_ffi_fn_func_probe_echo \
            || { echo "::error::the app bundle does not link the Rust core"; exit 1; }

  # The Rust core (stage 2, ADR 0012) is tested on every OS it will ship on.
  # Runner images are pinned for the same reason as the macOS job above.
  rust:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      # Installs the compiler pinned in rust/rust-toolchain.toml.
      - name: Toolchain
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --check

      - name: Lint (unwrap/expect denied in library code)
        run: cargo clippy --all-targets --locked -- -D warnings

      # Includes the shared-fixtures checks: an empty Tests/Fixtures fails.
      - name: Test
        run: cargo test --locked

  rust-licenses:
    name: Rust licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Allowlist in rust/deny.toml: permissive licenses only, GPL rejected.
      - name: License audit
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check licenses bans sources

      - name: Toolchain
        working-directory: rust
        run: rustup toolchain install

      - name: Third-party license list is current
        run: |
          python3 scripts/third-party-licenses.py
          git diff --exit-code rust/THIRD-PARTY-LICENSES.md \
            || { echo "::error::run scripts/third-party-licenses.py and commit rust/THIRD-PARTY-LICENSES.md"; exit 1; }
