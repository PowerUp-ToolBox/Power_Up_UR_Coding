name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build, test, and bundle
    # Pinned deliberately — never `macos-latest` (it rolled from 15 to 26 in
    # June 2026 and silent toolchain jumps break builds). Bump intentionally.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # rust/rust-toolchain.toml pins the compiler; rustup installs it. The
      # app links the core (slice 2.2), so this runs before any swift command.
      - name: Build the Rust core bridge
        run: ./scripts/build-core.sh debug

      # The shared fixtures (read by the Swift and Rust tests) are discovered
      # at run time, so an empty or missing directory would let the scenario
      # suites pass vacuously. Fail loudly instead.
      - name: Shared fixtures are present
        run: |
          test -d Tests/Fixtures || { echo "::error::Tests/Fixtures is missing"; exit 1; }
          count=$(find Tests/Fixtures -type f -name '*.json' | wc -l | tr -d ' ')
          echo "Tests/Fixtures holds $count JSON fixture(s)"
          test "$count" -gt 0 || { echo "::error::Tests/Fixtures holds no JSON fixtures"; exit 1; }
          for area in session mapping device; do
            found=$(find "Tests/Fixtures/$area" -type f -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
            test "$found" -gt 0 || { echo "::error::Tests/Fixtures/$area holds no fixtures"; exit 1; }
          done

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Full release pipeline: SPM release build, icon generation, .app
      # assembly, ad-hoc signing. Catches build.sh regressions and release-only
      # compile errors.
      - name: Bundle app
        run: ./scripts/build.sh

      - name: Verify bundle
        run: |
          test -x build/PowerUp.app/Contents/MacOS/PowerUp
          test -f build/PowerUp.app/Contents/Resources/AppIcon.icns
          plutil -lint build/PowerUp.app/Contents/Info.plist
          codesign --verify build/PowerUp.app
          nm build/PowerUp.app/Contents/MacOS/PowerUp | grep -q uniffi_powerup_core_ffi_fn_func_probe_echo \
            || { echo "::error::the app bundle does not link the Rust core"; exit 1; }

  # The Rust core (stage 2, ADR 0012) is tested on every OS it will ship on.
  # Runner images are pinned for the same reason as the macOS job above.
  rust:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      # Installs the compiler pinned in rust/rust-toolchain.toml.
      - name: Toolchain
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --check

      # The bridge turns a core panic into CoreBridgeError.Panicked with
      # catch_unwind, which an aborting panic would bypass (DESIGN v2.10).
      - name: No profile aborts on panic
        shell: bash
        run: |
          if grep -rn --include=Cargo.toml --include=config.toml -E 'panic *= *"abort"' . ; then
            echo "::error::panic = \"abort\" defeats the bridge's panic containment"
            exit 1
          fi

      - name: Lint (unwrap/expect denied in library code)
        run: cargo clippy --all-targets --locked -- -D warnings

      # Includes the shared-fixtures checks: an empty Tests/Fixtures fails.
      - name: Test
        run: cargo test --locked

  rust-licenses:
    name: Rust licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Allowlist in rust/deny.toml: permissive licenses only, GPL rejected.
      - name: License audit
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check licenses bans sources

      # Advisories change daily: reported in the log, never a merge blocker.
      - name: Security advisories (informational)
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check advisories

      - name: Toolchain
        working-directory: rust
        run: rustup toolchain install

      - name: Third-party license list is current
        run: |
          python3 scripts/third-party-licenses.py
          git diff --exit-code rust/THIRD-PARTY-LICENSES.md \
            || { echo "::error::run scripts/third-party-licenses.py and commit rust/THIRD-PARTY-LICENSES.md"; exit 1; }

  # PORTING-LEDGER.md tracks the hidden knowledge the Rust port must keep;
  # a row left as todo blocks the merge (plan stage 2 step 7).
  porting-ledger:
    name: Porting ledger
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No row is left todo
        run: |
          test -f PORTING-LEDGER.md || { echo "::error::PORTING-LEDGER.md is missing"; exit 1; }
          if grep -n -i -w 'todo' PORTING-LEDGER.md; then
            echo "::error::PORTING-LEDGER.md still has todo rows (lines above)"
            exit 1
          fi
